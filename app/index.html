<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed Me Token</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main id="shell">
      <div id="playfield" title="拖动场景可移动窗口" aria-label="Token 从左侧管道进入机器，能量棒在主角旁堆积；主角取棒后攻击右侧机器人。拖动场景可移动窗口。"></div>
      <footer id="hud">
        <div class="hud-stats">
          <div class="stat"><span class="stat-icon bar-icon">▰</span><span class="stat-label">能量棒</span><strong id="energy">0</strong></div>
          <div class="stat"><span class="stat-icon coin-icon">●</span><span class="stat-label">金币</span><strong id="coins">0</strong></div>
          <div class="stat"><span class="stat-label">LV</span><strong id="level">1</strong><span class="stat-label">波次</span><strong id="wave">1</strong></div>
          <button id="upgrade" type="button">攻击 +1 · 5 金币</button>
        </div>
        <div class="hud-controls">
          <span id="source-status" class="source-status">检测中</span>
          <div class="window-actions">
            <button id="refresh" type="button" title="刷新 Codex 用量" aria-label="刷新 Codex 用量">↻</button>
            <button id="details-toggle" type="button" title="展开数据状态" aria-label="展开数据状态">⌃</button>
            <button id="pin" type="button" title="切换置顶" aria-label="切换置顶">●</button>
            <button id="sound" type="button" title="切换声音" aria-label="切换声音">♪</button>
            <span class="control-divider" role="separator"></span>
            <button id="minimize" type="button" title="最小化窗口" aria-label="最小化窗口">−</button>
            <button id="close" type="button" title="退出游戏" aria-label="退出游戏">×</button>
          </div>
        </div>
      </footer>
      <section id="details" hidden>
        <div><span>启用后 token</span><strong id="tokens">0</strong></div>
        <div><span>兑换余数</span><strong id="remainder">0 / 1000</strong></div>
        <div><span>最近刷新</span><strong id="last-refresh">尚未刷新</strong></div>
        <p id="status-message">仅在本机读取 Codex 用量记录。</p>
      </section>
    </main>
  </body>
</html>
